name: Release Binary

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

jobs:
  build-binary:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build binary with PyInstaller
        run: |
          docker build . -t celery-exporter-builder -f Dockerfile.pyinstaller \
            --build-arg "PYTHON_VERSION=$(cat .python-version)"

      - name: Extract binary from container
        run: |
          container=$(docker create celery-exporter-builder)
          docker cp "$container":/app/dist/celery-exporter celery-exporter
          docker rm "$container"

      - name: Upload binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: celery-exporter

      - name: Update latest release binary
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: celery-exporter
